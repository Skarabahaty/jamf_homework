name: Terraform

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
      - ".github/actions/**"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
      - ".github/actions/**"

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: true
  TF_WORKING_DIR: terraform

jobs:
  validate:
    name: Format and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform format check
        run: terraform fmt -check -diff -recursive
      - name: Terraform init without backend
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -backend=false -input=false
      - name: Terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

  plan:
    name: Plan against remote state
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.TF_STATE_BUCKET != '' &&
      vars.TF_STATE_KEY != '' &&
      vars.AWS_REGION != '' &&
      vars.TF_PLAN_ROLE_ARN != ''
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Configure AWS and initialize remote state
        uses: ./.github/actions/terraform-remote-state
        with:
          role-arn: ${{ vars.TF_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          state-bucket: ${{ vars.TF_STATE_BUCKET }}
          state-key: ${{ vars.TF_STATE_KEY }}
          working-directory: ${{ env.TF_WORKING_DIR }}
      - name: Terraform plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_github_organization: ${{ vars.GITHUB_ORGANIZATION }}
          TF_VAR_github_token: ${{ secrets.TERRAFORM_GITHUB_TOKEN }}
          TF_VAR_repositories: ${{ vars.TF_REPOSITORIES }}
          TF_VAR_app_installations: ${{ vars.TF_APP_INSTALLATIONS }}
          TF_VAR_protected_branches: ${{ vars.TF_PROTECTED_BRANCHES }}
        run: terraform plan -input=false -no-color

  apply:
    name: Apply after merge
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Configure AWS and initialize remote state
        uses: ./.github/actions/terraform-remote-state
        with:
          role-arn: ${{ vars.TF_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          state-bucket: ${{ vars.TF_STATE_BUCKET }}
          state-key: ${{ vars.TF_STATE_KEY }}
          working-directory: ${{ env.TF_WORKING_DIR }}
      - name: Terraform apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_github_organization: ${{ vars.GITHUB_ORGANIZATION }}
          TF_VAR_github_token: ${{ secrets.TERRAFORM_GITHUB_TOKEN }}
          TF_VAR_repositories: ${{ vars.TF_REPOSITORIES }}
          TF_VAR_app_installations: ${{ vars.TF_APP_INSTALLATIONS }}
          TF_VAR_protected_branches: ${{ vars.TF_PROTECTED_BRANCHES }}
        run: terraform apply -input=false -auto-approve
