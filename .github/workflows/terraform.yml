name: Terraform

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: true
  TF_WORKING_DIR: terraform

jobs:
  validate:
    name: Format and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform format check
        run: terraform fmt -check -diff -recursive
      - name: Terraform init without backend
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -backend=false -input=false
      - name: Terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

  plan:
    name: Plan against remote state
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.TF_STATE_BUCKET != '' &&
      vars.TF_STATE_KEY != '' &&
      vars.AWS_REGION != '' &&
      vars.TF_PLAN_ROLE_ARN != ''
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Require configured remote state and plan role
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          TF_PLAN_ROLE_ARN: ${{ vars.TF_PLAN_ROLE_ARN }}
        run: |
          python3 - <<'PY'
          import os

          required = ("TF_STATE_BUCKET", "TF_STATE_KEY", "AWS_REGION", "TF_PLAN_ROLE_ARN")
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit(f"Missing required GitHub Actions variables: {', '.join(missing)}")
          PY
      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Create temporary backend config
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          required = ("TF_STATE_BUCKET", "TF_STATE_KEY", "AWS_REGION")
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit(f"Missing required repository variables: {', '.join(missing)}")

          config = {
              "bucket": os.environ["TF_STATE_BUCKET"],
              "key": os.environ["TF_STATE_KEY"],
              "region": os.environ["AWS_REGION"],
              "encrypt": True,
              "use_lockfile": True,
          }
          Path(os.environ["RUNNER_TEMP"], "backend.json").write_text(
              json.dumps(config) + "\n", encoding="utf-8"
          )
          PY
      - name: Terraform init with remote backend
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false -backend-config="$RUNNER_TEMP/backend.json"
      - name: Terraform plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_github_organization: ${{ vars.GITHUB_ORGANIZATION }}
          TF_VAR_github_token: ${{ secrets.GITHUB_TOKEN }}
          TF_VAR_repositories: ${{ vars.TF_REPOSITORIES }}
          TF_VAR_app_installations: ${{ vars.TF_APP_INSTALLATIONS }}
          TF_VAR_protected_branches: ${{ vars.TF_PROTECTED_BRANCHES }}
        run: terraform plan -input=false -no-color

  apply:
    name: Apply after merge
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Require configured remote state and apply role
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          TF_APPLY_ROLE_ARN: ${{ vars.TF_APPLY_ROLE_ARN }}
        run: |
          python3 - <<'PY'
          import os

          required = ("TF_STATE_BUCKET", "TF_STATE_KEY", "AWS_REGION", "TF_APPLY_ROLE_ARN")
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit(f"Missing required GitHub Actions variables: {', '.join(missing)}")
          PY
      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Create temporary backend config
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          required = ("TF_STATE_BUCKET", "TF_STATE_KEY", "AWS_REGION")
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit(f"Missing required repository variables: {', '.join(missing)}")

          config = {
              "bucket": os.environ["TF_STATE_BUCKET"],
              "key": os.environ["TF_STATE_KEY"],
              "region": os.environ["AWS_REGION"],
              "encrypt": True,
              "use_lockfile": True,
          }
          Path(os.environ["RUNNER_TEMP"], "backend.json").write_text(
              json.dumps(config) + "\n", encoding="utf-8"
          )
          PY
      - name: Terraform init with remote backend
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false -backend-config="$RUNNER_TEMP/backend.json"
      - name: Terraform apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_github_organization: ${{ vars.GITHUB_ORGANIZATION }}
          TF_VAR_github_token: ${{ secrets.GITHUB_TOKEN }}
          TF_VAR_repositories: ${{ vars.TF_REPOSITORIES }}
          TF_VAR_app_installations: ${{ vars.TF_APP_INSTALLATIONS }}
          TF_VAR_protected_branches: ${{ vars.TF_PROTECTED_BRANCHES }}
        run: terraform apply -input=false -auto-approve
