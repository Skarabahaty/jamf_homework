name: Terraform

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: true
  TF_WORKING_DIR: terraform

jobs:
  plan:
    name: Format, validate, and plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform format check
        run: terraform fmt -check -diff -recursive
      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false
      - name: Terraform validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate
      - name: Terraform plan
        if: github.event_name == 'pull_request'
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_github_organization: ${{ vars.GITHUB_ORGANIZATION }}
          TF_VAR_github_token: ${{ secrets.GITHUB_TOKEN }}
          TF_VAR_repositories: ${{ vars.TF_REPOSITORIES }}
          TF_VAR_app_installations: ${{ vars.TF_APP_INSTALLATIONS }}
          TF_VAR_protected_branches: ${{ vars.TF_PROTECTED_BRANCHES }}
        run: terraform plan -input=false -no-color

  apply:
    name: Apply after merge
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: plan
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -input=false
      - name: Terraform apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_github_organization: ${{ vars.GITHUB_ORGANIZATION }}
          TF_VAR_github_token: ${{ secrets.GITHUB_TOKEN }}
          TF_VAR_repositories: ${{ vars.TF_REPOSITORIES }}
          TF_VAR_app_installations: ${{ vars.TF_APP_INSTALLATIONS }}
          TF_VAR_protected_branches: ${{ vars.TF_PROTECTED_BRANCHES }}
        run: terraform apply -input=false -auto-approve
